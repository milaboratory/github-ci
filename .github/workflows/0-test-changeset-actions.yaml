name: 'Test: changeset actions'

on:
  workflow_call:
  workflow_dispatch:   # manual escape hatch — also lets us re-run after a workflow edit
  pull_request:
    paths:
      - 'actions/changeset/**'
  push:
    paths:
      - 'actions/changeset/**'
    branches: ['v4', 'v4-beta']

jobs:
  bats:
    name: bats (${{ matrix.action.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - { dir: 'check-coverage', suite: 'test/coverage.bats' }
          - { dir: 'require-package-bump', suite: 'test/require-package-bump.bats' }
    steps:
      - uses: actions/checkout@v4

      # No `version:` — the repo's root package.json sets `packageManager`,
      # and pnpm/action-setup errors if both are specified.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Verify required tools are present
        run: |
          which jq yq pnpm bats
          jq --version
          yq --version
          pnpm --version
          bats --version

      - name: Run changeset/${{ matrix.action.dir }} bats suite
        working-directory: actions/changeset/${{ matrix.action.dir }}
        run: bats ${{ matrix.action.suite }}
