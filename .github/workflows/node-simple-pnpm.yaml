# This workflow will build and upload nodejs application on the github's npm registry.

name: Build and Upload NodeJS PNPM Applications

on:
  workflow_call:
    inputs:
      #
      # Common settings
      #
      app-name:
        description: |
          Application name in human-readable form.
          As it is supposed to be shown in messages
        type: string
        required: false
        default: ${{ github.repository }}

      app-name-slug:
        description: |
          Application name slug (part of release file name)
        type: string
        required: true

      gha-runner-label:
        description: |
          The label for github actions hosted runner
        type: string
        default: 'ubuntu-latest'

      #
      # Checkout settings
      #
      checkout-submodules:
        description: |
          'Submodules' mode for 'actions/checkout' action
          '', 'false' - disable submodules support
          'true' - checkout submodules
          'recursive' - checkout submodules recursive
        type: string
        required: false
        default: ''

      checkout-git-lfs:
        description: |
          Use git lfs when checking-out the repository
        type: string
        required: false
        default: 'false'

      #
      # Environment settings
      #
      env:
        description: |
          custom environment variables to set for all jobs in workflow
          as JSON-encoded map:
            { "MY_VAR_1": "awesome value",
              "VARIABLE_2": "not so awesome :)" }

          This input's envs are merged with secrets.env
          This input's envs have lower priority compared than secrets.env
        type: string
        required: false
        default: '{}'

      #
      # NodeJS settings
      #
      node-version:
        description: |
          Node version to use
        type: string
        required: true

      #
      # Golang settings
      #
      golang-version:
        description: |
          Node version to use.
          Examples: '1.19', '1.20'
        type: string
        required: false

      golang-cache-hashfiles-path:
        description: |
          Returns a single hash for the set of files that matches the path pattern.
          You can provide a single path pattern or multiple path patterns separated by commas.
          The path is relative to the GITHUB_WORKSPACE directory
          and can only include files inside of the GITHUB_WORKSPACE.
        type: string
        required: false
        default: '**/go.sum'

      #
      # Cache control
      #
      cache-version:
        description: |
          Simple hack, that allows to 'reset' cache for particular job.

          Just change the value of this parameter and the next run will
          not find build cache and will have to start from scratch.

        type: string
        required: false
        default: 'v1'

      cache-hashfiles-search-path:
        description: |
          Hashfiles search path for pnpm-lock.yaml
        type: string
        required: false
        default: 'pnpm-lock.yaml'

      team-id:
        description: |
          The Team ID to use. This controls the directory where turbo cache entries will be saved
        type: string
        required: false
        default: 'ci'

      #
      # PNPM settings
      #
      pnpm-version:
        description: |
          Version of pnpm to install.
        type: string
        required: false
        default: 'latest'

      pnpm-recursive-build:
        description: |
          Run pnpm build with -r flag.
        type: boolean
        required: true

      pnpm-recursive-tests:
        description: |
          Run pnpm tests with -r flag.
        type: boolean
        required: true

      pnpm-build-args:
        description: |
          Additional pnpm build arguments to pass
          for none --recursive pnpm invocations.
        type: string
        required: false

      pnpm-tests-args:
        description: |
          Additional pnpm tests arguments to pass
          for none --recursive pnpm invocations.
        type: string
        required: false

      #
      # Build control
      #
      build-script-name:
        description: |
          The name of a build script
        type: string
        required: true
        default: 'build'

      build-before-publish-script-name:
        description: |
          The name of a build before publish script
        type: string
        required: false

      is-electron-application:
        description: |
          If 'true' enables cache for an Electron application,
          if 'false', enables cache for a generic NodeJS application.
        type: string
        required: false
        default: 'true'

      #
      # Build pre-calculated control
      #
      pre-calculated:
        description:
          Flag to indicate whether individual subtasks are pre-calculated on isolated nodes
          to enable parallel builds within a monorepo workflow. Set to true to activate pre-calculation.
        type: boolean
        required: false
        default: false

      pre-calculated-task-list:
        description:
          JSON-formatted string listing of the specific subtasks that have been pre-calculated.
          This list is used to manage and track the execution of parallel builds in the monorepo.
        type: string
        required: false
        default: '[]'

      #
      # Test control
      #
      test:
        description: |
          Run tests
        type: boolean
        required: false
        default: false

      test-script-name:
        description: |
          The name of a test
        type: string
        required: false
        default: 'test'

      test-dry-run-script-name:
        description: |
          The name of a test dry-run script
        type: string
        required: false
        default: 'test:dry-run'

      test-skip-dry-run:
        description: |
          Skip test dry-run step
        type: string
        required: false
        default: 'false'

      test-coverage:
        description: |
          Whether to upload coverage reports to Codecov.
        type: boolean
        required: false
        default: false

      test-coverage-reports:
        description: |
          Comma-separated list of coverage report files to upload to Codecov.
          If empty, no coverage reports will be uploaded.
        type: string
        required: false
        default: ''

      test-results-reports:
        description: |
          Comma-separated list of test results report files to upload to Codecov.
          If empty, no test results reports will be uploaded.
        type: string
        required: false
        default: ''

      #
      # NPM registry settings
      #
      npmrc-config:
        description: |
          Generates a .npmrc file based on provided configuration.
        type: string
        required: true

      #
      # Distribution control
      #
      publish-to-public:
        description: |
          Whether or not the npm package should be published as public.
        type: string
        required: false
        default: 'false'

      create-tag:
        description: |
          Create a tag after publishing the package.
        type: string
        required: false
        default: 'false'

      package-path:
        description: |
          Relative path to the package.json with package version.
        type: string
        required: false
        default: '.'

      aws-region:
        description: |
          The AWS region
        type: string
        required: false
        default: 'eu-central-1'

      aws-login-duration:
        description: |
          Maximum time AWS credentials will be valid until expiration.
          Defaults to 1 hour.
        type: number
        required: false
        default: 3600

      #
      # Platforma Docker settings
      #
      pl-start-for-tests:
        description: |
          Start Platforma Backend instance for tests
        type: boolean
        required: false
        default: true

      pl-docker-tag:
        description: |
          Platforma docker tag.
        type: string
        required: false
        default: 'main'

      pl-docker-registry-push-to:
        description: |
          Docker registry to push platforma containers to.
          Set to empty string to disable pushing.
        type: string
        required: false
        default: 'quay.io/milaboratories/pl-containers'

      pl-test-assets-dir:
        description: |
          Platforma test assets directory;
          this directory will be mounted inside
          the container under the path `/storage/controllers/data/library`
          The path must be relative to github.workspace
          and will be appended to github.workspace within the docker compose action.
        type: string
        required: false
        default: 'assets'

      pl-log-level:
        description: |
          Platforma log level for tests.
          Examples: 'debug', 'info', 'warn', 'error'
        type: string
        required: false
        default: 'info'

      #
      # Changed files
      #
      changeset-default-branch:
        description:
          Specify the default branch for changesets to run checks against.
        type: string
        required: false
        default: 'main'

      require-package-path-bump:
        description: |
          Opt-in gate (block repos): on `pull_request` events, require both
          halves of the release contract to hold.

            1. The package at `package-path` is DIRECTLY bumped by a changeset.
               Required on every PR, whether or not that package's own files
               changed. Sibling/devDependency cascade bumps do NOT satisfy it.
            2. Every other workspace package whose own files the PR edits is
               bumped too. Private packages are skipped — they are never
               published — and a dependency or catalog version bump does not
               count as editing a package.

          Neither half implies the other: half 1 ignores the diff, half 2
          ignores untouched packages. Half 2 only bites in a repo with more than
          one publishable package — in a block repo the private
          `model`/`ui`/`workflow`/`test` siblings are skipped and `block` is
          already covered by half 1.

          Either half failing turns the `check for changesets` check RED, which
          blocks merge via branch protection. Two ways out, each waiving the gate
          as a whole: an empty changeset added in the branch
          (`pnpm changeset --empty`), which is the in-repo "no release needed"
          statement, or the `skip-changelog` label on the PR. Not enforced in the
          merge queue; the build/test jobs keep running regardless so CI stays
          usable while iterating.
        type: boolean
        required: false
        default: false

      require-review:
        description: |
          Whether or not to require a review for the PR.
        type: boolean
        required: false
        default: false

      #
      # Docker settings
      #
      docker-quay-push:
        description: |
          Whether or not to push images to quay.io registry.
        type: boolean
        required: false
        default: true

      docker-ga-push:
        description: |
          Whether or not to push images to GA registry.
        type: boolean
        required: false
        default: true

      verify-docker-images:
        description: |
          Before publishing, check that every docker image referenced by the
          block's entrypoint descriptors is present in the registry.
          Guards against publishing a block whose images were built but never
          pushed, which only surfaces as a runtime 404.
        type: boolean
        required: false
        default: true

      notify-slack:
        description: |
          Enable Slack notifications
        required: false
        type: boolean
        default: true

      cache-monitoring:
        description: |
          Enable merge queue duration monitoring.
          When enabled, alerts if merge queue takes longer than
          the specified threshold (indicating potential cache issues).
        required: false
        type: boolean
        default: false

      cache-monitoring-duration-minutes:
        description: |
          Maximum expected duration in minutes for merge queue runs.
          If a run exceeds this duration, a Slack alert is sent.
          Default is 10 minutes.
        required: false
        type: number
        default: 10

    secrets:
      env:
        description: |
          custom environment variables to set for all jobs in workflow
          as JSON-encoded map:
            { "MY_VAR_1": "awesome value",
              "VARIABLE_2": "not so awesome :)" }

          This input's envs are merged with inputs.env
          This input's envs have HIGHER priority compared than inputs.env
        required: false

      SLACK_BOT_TOKEN:
        description: |
          Slack bot token for notifications
        required: false
      SLACK_CHANNEL:
        description: |
          Slack channel for notifications
        required: false
      GH_ZEN_APP_ID:
        description: |
          Zen Artisian Github AppID
        required: false
      GH_ZEN_APP_PRIVATE_KEY:
        description: |
          Zen Artisian Github App PrivateKey
        required: false

jobs:
  init:
    name: Init
    runs-on: ${{ inputs.gha-runner-label }}
    steps:
      - id: context
        uses: milaboratory/github-ci/actions/context@v4
    outputs:
      is-release: ${{ steps.context.outputs.is-release }}
      current-version: ${{ steps.context.outputs.current-version }}

  metadata:
    name: get run metadata
    runs-on: ${{ inputs.gha-runner-label }}
    needs:
      - init
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.checkout-git-lfs }}
          submodules: ${{ inputs.checkout-submodules }}

      - id: npm-pkg-metadata
        uses: milaboratory/github-ci/actions/shell@v4
        env:
          PACKAGE_PATH: ${{ inputs.package-path }}
        with:
          run: |
            NPM_PKG_VERSION="$(cat "${GITHUB_WORKSPACE}/${PACKAGE_PATH}/package.json" | jq --raw-output '.version')"
            PNPM_VERSION="$(cat "${GITHUB_WORKSPACE}/package.json" | jq --raw-output 'if .packageManager and (.packageManager | length > 0) then .packageManager | split("@")[1] else empty end')"
            ghwa_set_output npm-pkg-version "${NPM_PKG_VERSION}"
            ghwa_set_output pnpm-version "${PNPM_VERSION}"

    outputs:
      npm-pkg-version: ${{ fromJSON(steps.npm-pkg-metadata.outputs.data).npm-pkg-version }}
      pnpm-version: ${{ fromJSON(steps.npm-pkg-metadata.outputs.data).pnpm-version }}

  preflight-require-latest:
    name: preflight (require-latest)
    runs-on: ${{ inputs.gha-runner-label }}
    # Surface SDK-version drift on PRs as a non-blocking check, but enforce it
    # on the default branch and in the merge queue so publish cannot proceed
    # with a stale @platforma-sdk dependency.
    continue-on-error: ${{ github.ref_name != inputs.changeset-default-branch && github.event_name != 'merge_group' }}
    needs:
      - init
    steps:
      - uses: milaboratory/github-ci/actions/context@v4

      - uses: milaboratory/github-ci/actions/env@v4
        with:
          inputs: ${{ inputs.env }}
          secrets: ${{ secrets.env }}

      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.checkout-git-lfs }}
          submodules: ${{ inputs.checkout-submodules }}
          fetch-depth: '0'

      - name: Check infrastructure requirements for publication
        uses: milaboratory/github-ci/actions/node/require-latest@v4
        with:
          packages: |
            @platforma-sdk/block-tools
            @platforma-sdk/tengo-builder

  preflight-pnpm-lock-sync:
    name: preflight (pnpm-lock-sync)
    runs-on: ${{ inputs.gha-runner-label }}
    # Surface pnpm-workspace.yaml / pnpm-lock.yaml drift on PRs as a
    # non-blocking check, but enforce it on the default branch and in the
    # merge queue so publish cannot proceed with a stale lockfile.
    continue-on-error: ${{ github.ref_name != inputs.changeset-default-branch && github.event_name != 'merge_group' }}
    needs:
      - init
    steps:
      - uses: milaboratory/github-ci/actions/context@v4

      - uses: milaboratory/github-ci/actions/env@v4
        with:
          inputs: ${{ inputs.env }}
          secrets: ${{ secrets.env }}

      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.checkout-git-lfs }}
          submodules: ${{ inputs.checkout-submodules }}
          fetch-depth: '0'

      - name: Check pnpm-lock.yaml is in sync with pnpm-workspace.yaml
        shell: bash
        env:
          DEFAULT_BRANCH: origin/${{ inputs.changeset-default-branch }}
        run: |
          if git diff --name-only ${DEFAULT_BRANCH}..HEAD | grep -q -E '^pnpm-workspace.yaml$'; then
            if ! git diff --name-only ${DEFAULT_BRANCH}..HEAD | grep -q -E '^pnpm-lock.yaml$'; then
              echo "Changes in pnpm-workspace.yaml detected, but no updates in pnpm-lock.yaml were found in current branch"
              exit 1
            fi
          fi

  check-changesets:
    name: check for changesets
    runs-on: ${{ inputs.gha-runner-label }}
    # Block mode (`require-package-path-bump`): skip the whole job — so the
    # required check reports `skipped` (== passing) — when the PR carries the
    # `skip-changelog` label (a single global name, not per-repo configurable).
    # Labels are only in the `pull_request` context. Guarded by the toggle so
    # non-block runs are unaffected (the job always runs).
    if: >
      !( inputs.require-package-path-bump &&
         github.event_name == 'pull_request' &&
         contains(github.event.pull_request.labels.*.name, 'skip-changelog') )
    # Off (default): unchanged — non-blocking on PRs, blocking on merge_group /
    # push-to-default. On (block mode): red-capable ONLY on pull_request (a
    # missing bump blocks merge); non-enforcing everywhere else so the merge
    # queue isn't re-gated.
    continue-on-error: ${{ inputs.require-package-path-bump && github.event_name != 'pull_request' || (!inputs.require-package-path-bump && (github.ref_name != inputs.changeset-default-branch && github.event_name != 'merge_group')) }}
    needs:
      - metadata
    steps:
      - id: context
        uses: milaboratory/github-ci/actions/context@v4

      - uses: milaboratory/github-ci/actions/env@v4
        with:
          inputs: ${{ inputs.env }}
          secrets: ${{ secrets.env }}

      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.checkout-git-lfs }}
          submodules: ${{ inputs.checkout-submodules }}
          fetch-depth: '0'

      - name: Prepare environment for building a NodeJS application
        uses: milaboratory/github-ci/actions/node/prepare-pnpm@v4
        env:
          PNPM_VERSION: ${{ needs.metadata.outputs.pnpm-version }}
        with:
          node-version: ${{ inputs.node-version }}
          cache-version: ${{ inputs.cache-version }}
          pnpm-version: ${{ env.PNPM_VERSION || inputs.pnpm-version }}
          cache-hashfiles-search-path: ${{ inputs.cache-hashfiles-search-path }}
          npmrc-config: ${{ inputs.npmrc-config }}
          cache-s3-access-key: ${{ env.HZ_CI_CACHE_S3_ACCESS_KEY }}
          cache-s3-secret-key: ${{ env.HZ_CI_CACHE_S3_SECRET_KEY }}

      - name: Install NodeJS packages with pnpm
        uses: milaboratory/github-ci/actions/shell@v4
        with:
          run: |
            pnpm install --frozen-lockfile --prefer-offline

      # Default gate: some changeset must exist (any package).
      - name: Check for Changesets
        if: ${{ !inputs.require-package-path-bump }}
        uses: milaboratory/github-ci/actions/shell@v4
        env:
          BRANCH_NAME: ${{ inputs.changeset-default-branch }}
        with:
          run: |
            pnpm changeset status --since="origin/${BRANCH_NAME}"

      # Block mode, half 1: the `package-path` package must be bumped DIRECTLY,
      # on every PR, whether or not its own files changed (empty changeset
      # waives; the bypass label is handled by the job `if` above).
      # PR-only — merge_group / push need no enforcement here.
      - name: Require package bump by changeset
        if: ${{ inputs.require-package-path-bump && github.event_name == 'pull_request' }}
        uses: milaboratory/github-ci/actions/changeset/require-package-bump@v4
        with:
          package-path: ${{ inputs.package-path }}
          base-branch: ${{ inputs.changeset-default-branch }}

      # Block mode, half 2: every other workspace package the PR edits must be
      # bumped as well. Runs even when half 1 already failed, so one red check
      # reports the complete set of missing bumps instead of one at a time.
      - name: Require changeset coverage for every edited package
        if: ${{ !cancelled() && inputs.require-package-path-bump && github.event_name == 'pull_request' }}
        uses: milaboratory/github-ci/actions/changeset/check-coverage@v4
        with:
          base-branch: ${{ inputs.changeset-default-branch }}

  pre-calculated-build:
    name: pre-build
    runs-on: ${{ inputs.gha-runner-label }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pre-calculated-task-list) }}
    needs:
      - preflight-require-latest
      - preflight-pnpm-lock-sync
      - check-changesets
      - metadata
    # In block mode (`require-package-path-bump`) `check-changesets` can go RED
    # to block merge; the build must still run, so its `!failure()` +
    # `check-changesets` guards are toggle-gated. Toggle off → identical to the
    # original (`!failure()` + the check-changesets clause); the always-on
    # metadata guard is redundant then (`!failure()` already covers it).
    if: >
      inputs.pre-calculated && inputs.pre-calculated-task-list != '[]' &&
      !cancelled() &&
      ( needs.metadata.result == 'success' || needs.metadata.result == 'skipped' ) &&
      ( inputs.require-package-path-bump || !failure() ) &&
      (
        needs.preflight-require-latest.result == 'success' ||
        needs.preflight-require-latest.result == 'skipped'
      ) &&
      (
        needs.preflight-pnpm-lock-sync.result == 'success' ||
        needs.preflight-pnpm-lock-sync.result == 'skipped'
      ) &&
      (
        inputs.require-package-path-bump ||
        needs.check-changesets.result == 'success' ||
        needs.check-changesets.result == 'skipped'
      )
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: milaboratory/github-ci/actions/env@v4
        with:
          inputs: ${{ inputs.env }}
          secrets: ${{ secrets.env }}

      - name: Generate Zen Artisan Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_ZEN_APP_ID }}
          private-key: ${{ secrets.GH_ZEN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.checkout-git-lfs }}
          submodules: ${{ inputs.checkout-submodules }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_CI_IAM_MONOREPO_SIMPLE_ROLE }}
          role-duration-seconds: ${{ inputs.aws-login-duration }}
          aws-region: ${{ inputs.aws-region }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Login to Quay.io
        if: inputs.docker-quay-push && env.QUAY_USERNAME != '' && env.QUAY_ROBOT_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ env.QUAY_USERNAME }}
          password: ${{ env.QUAY_ROBOT_TOKEN }}
          ecr: false

      - name: Login to Docker GA
        if: inputs.docker-ga-push && env.QUAY_USERNAME != '' && env.QUAY_ROBOT_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: containers.pl-open.science
          username: ${{ env.QUAY_USERNAME }}
          password: ${{ env.QUAY_ROBOT_TOKEN }}
          ecr: false

      # Turbo remote cache. Opt-in: when HZ_CI_TURBO_S3_BUCKET is provided (self-hosted
      # hz runners) cache to RGW; otherwise the existing AWS S3 bucket is used unchanged
      # (backward-compatible — blocks migrate one at a time). The S3_* env is scoped to
      # THIS step only: NEVER set it globally, or it redirects aws-cli/ECR to RGW and
      # breaks image pulls/pushes.
      - name: Turbo remote cache (RGW)
        if: env.HZ_CI_TURBO_S3_BUCKET != ''
        uses: milaboratory/github-ci/actions/turborepo/cache-s3@v4
        env:
          S3_ACCESS_KEY: ${{ env.HZ_CI_TURBO_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ env.HZ_CI_TURBO_S3_SECRET_KEY }}
          S3_REGION: ${{ env.HZ_CI_TURBO_S3_REGION }}
          S3_ENDPOINT: https://${{ env.HZ_CI_TURBO_S3_ENDPOINT }}
          S3_USE_PATH_STYLE: 'true'
        with:
          storage-provider: 's3'
          storage-path: ${{ env.HZ_CI_TURBO_S3_BUCKET }}
          team-id: ${{ inputs.team-id }}

      - name: Turbo remote cache (AWS)
        if: env.HZ_CI_TURBO_S3_BUCKET == ''
        uses: milaboratory/github-ci/actions/turborepo/cache-s3@v4
        with:
          storage-provider: 's3'
          storage-path: ${{ env.AWS_CI_TURBOREPO_S3_BUCKET }}
          team-id: ${{ inputs.team-id }}

      - name: Prepare environment for building a NodeJS application
        uses: milaboratory/github-ci/actions/node/prepare-pnpm@v4
        env:
          PNPM_VERSION: ${{ needs.metadata.outputs.pnpm-version }}
        with:
          node-version: ${{ inputs.node-version }}
          cache-version: ${{ inputs.cache-version }}
          pnpm-version: ${{ env.PNPM_VERSION || inputs.pnpm-version }}
          cache-hashfiles-search-path: ${{ inputs.cache-hashfiles-search-path }}
          npmrc-config: ${{ inputs.npmrc-config }}
          cache-s3-access-key: ${{ env.HZ_CI_CACHE_S3_ACCESS_KEY }}
          cache-s3-secret-key: ${{ env.HZ_CI_CACHE_S3_SECRET_KEY }}

      - name: Install NodeJS packages with pnpm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ env.NPMJS_TOKEN  }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline

      - name: Run changeset version
        if: ( github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: milaboratory/github-ci/actions/shell@v4
        with:
          run: |
            pnpm run version-packages

      - name: Run build for - ${{ matrix.step }}
        shell: bash
        env:
          PRE_CALCULATED_STEP: ${{ matrix.step }}
        run: |
          pnpm run build --filter="${PRE_CALCULATED_STEP}"
    outputs:
      status: 'completed'

  build-test-publish:
    name: unified (build test publish)
    runs-on: ${{ inputs.gha-runner-label }}
    needs:
      - preflight-require-latest
      - preflight-pnpm-lock-sync
      - check-changesets
      - metadata
      - pre-calculated-build
    # In block mode (`require-package-path-bump`) `check-changesets` can go RED
    # to block merge; build/test must still run, so its `!failure()` +
    # `check-changesets` guards are toggle-gated. Toggle off → identical to the
    # original (`!failure()` + the check-changesets clause); the always-on
    # metadata guard is redundant then (`!failure()` already covers it).
    if: >
      !cancelled() &&
      ( needs.metadata.result == 'success' || needs.metadata.result == 'skipped' ) &&
      ( inputs.require-package-path-bump || !failure() ) &&
      (
        needs.preflight-require-latest.result == 'success' ||
        needs.preflight-require-latest.result == 'skipped'
      ) &&
      (
        needs.preflight-pnpm-lock-sync.result == 'success' ||
        needs.preflight-pnpm-lock-sync.result == 'skipped'
      ) &&
      (
        needs.pre-calculated-build.result == 'success' ||
        needs.pre-calculated-build.result == 'skipped'
      ) &&
      (
        inputs.require-package-path-bump ||
        needs.check-changesets.result == 'success' ||
        needs.check-changesets.result == 'skipped'
      )
    permissions:
      id-token: write
      packages: write
      contents: write
      pull-requests: write
      issues: read

    steps:
      - id: context
        uses: milaboratory/github-ci/actions/context@v4

      - uses: milaboratory/github-ci/actions/env@v4
        with:
          inputs: ${{ inputs.env }}
          secrets: ${{ secrets.env }}

      - name: Generate Zen Artisan Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_ZEN_APP_ID }}
          private-key: ${{ secrets.GH_ZEN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          lfs: ${{ inputs.checkout-git-lfs }}
          submodules: ${{ inputs.checkout-submodules }}
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: '0'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_CI_IAM_MONOREPO_SIMPLE_ROLE }}
          role-duration-seconds: ${{ inputs.aws-login-duration }}
          aws-region: ${{ inputs.aws-region }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Login to Quay.io
        if: inputs.docker-quay-push && env.QUAY_USERNAME != '' && env.QUAY_ROBOT_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ env.QUAY_USERNAME }}
          password: ${{ env.QUAY_ROBOT_TOKEN }}
          ecr: false

      - name: Login to Docker GA
        if: inputs.docker-ga-push && env.QUAY_USERNAME != '' && env.QUAY_ROBOT_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: containers.pl-open.science
          username: ${{ env.QUAY_USERNAME }}
          password: ${{ env.QUAY_ROBOT_TOKEN }}
          ecr: false

      - name: Prepare environment for Golang when requested
        if: inputs.golang-version != ''
        uses: milaboratory/github-ci/actions/golang/prepare@v4
        with:
          golang-version: ${{ inputs.golang-version }}
          cache-version: ${{ inputs.cache-version }}
          cache-dependency-hashfiles-path: ${{ inputs.golang-cache-hashfiles-path }}

      - name: Prepare environment for building a NodeJS application
        uses: milaboratory/github-ci/actions/node/prepare-pnpm@v4
        env:
          PNPM_VERSION: ${{ needs.metadata.outputs.pnpm-version }}
        with:
          node-version: ${{ inputs.node-version }}
          cache-version: ${{ inputs.cache-version }}
          pnpm-version: ${{ env.PNPM_VERSION || inputs.pnpm-version }}
          cache-hashfiles-search-path: ${{ inputs.cache-hashfiles-search-path }}
          npmrc-config: ${{ inputs.npmrc-config }}
          cache-s3-access-key: ${{ env.HZ_CI_CACHE_S3_ACCESS_KEY }}
          cache-s3-secret-key: ${{ env.HZ_CI_CACHE_S3_SECRET_KEY }}

      # Turbo remote cache. Opt-in: when HZ_CI_TURBO_S3_BUCKET is provided (self-hosted
      # hz runners) cache to RGW; otherwise the existing AWS S3 bucket is used unchanged
      # (backward-compatible — blocks migrate one at a time). The S3_* env is scoped to
      # THIS step only: NEVER set it globally, or it redirects aws-cli/ECR to RGW and
      # breaks image pulls/pushes.
      - name: Turbo remote cache (RGW)
        if: env.HZ_CI_TURBO_S3_BUCKET != ''
        uses: milaboratory/github-ci/actions/turborepo/cache-s3@v4
        env:
          S3_ACCESS_KEY: ${{ env.HZ_CI_TURBO_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ env.HZ_CI_TURBO_S3_SECRET_KEY }}
          S3_REGION: ${{ env.HZ_CI_TURBO_S3_REGION }}
          S3_ENDPOINT: https://${{ env.HZ_CI_TURBO_S3_ENDPOINT }}
          S3_USE_PATH_STYLE: 'true'
        with:
          storage-provider: 's3'
          storage-path: ${{ env.HZ_CI_TURBO_S3_BUCKET }}
          team-id: ${{ inputs.team-id }}

      - name: Turbo remote cache (AWS)
        if: env.HZ_CI_TURBO_S3_BUCKET == ''
        uses: milaboratory/github-ci/actions/turborepo/cache-s3@v4
        with:
          storage-provider: 's3'
          storage-path: ${{ env.AWS_CI_TURBOREPO_S3_BUCKET }}
          team-id: ${{ inputs.team-id }}

      - name: Install NodeJS packages with pnpm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ env.NPMJS_TOKEN  }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline

      - name: Run changeset version
        if: ( github.event_name == 'push' && github.ref_name == 'main') || github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        run: |
          pnpm run version-packages

      - name: Get changed files staged and unstaged
        if: github.event_name == 'push'
          && github.ref_name == 'main'
        id: check-changes
        shell: bash
        run: |
          # Check for tracked files
          TRACKED_FILES=$(git diff --diff-filter=ACMUXTR --name-only)
          # Check for untracked files
          UNTRACKED_FILES=$(git ls-files --others --exclude-standard)
          # Check for unstaged deleted files
          UNSTAGED_DELETED_FILES=$(git ls-files --deleted)

          if [ -n "${TRACKED_FILES}" ] || [ -n "${UNTRACKED_FILES}" ] || [ -n "${UNSTAGED_DELETED_FILES}" ]; then
            echo "Local changes detected but not committed."
            echo "has-changes=1" >> $GITHUB_OUTPUT
            echo "Tracked files:"
            echo "${TRACKED_FILES}"
            echo "Untracked files:"
            echo "${UNTRACKED_FILES}"
            echo "Unstaged deleted files:"
            echo "${UNSTAGED_DELETED_FILES}"
          else
            echo "No local changes detected."
            echo "has-changes=0" >> $GITHUB_OUTPUT
          fi

      - name: Run build
        uses: milaboratory/github-ci/blocks/monorepo/build-and-test-pnpm@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ env.NPMJS_TOKEN  }}
          PNPM_VERSION: ${{ needs.metadata.outputs.pnpm-version }}
          PL_DOCKER_REGISTRY_PUSH_TO: ${{ inputs.pl-docker-registry-push-to }}
        with:
          build-script-name: ${{ inputs.build-script-name }}
          tests: 'false'
          test-script-name: ${{ inputs.test-script-name }}
          pnpm-recursive-build: ${{ inputs.pnpm-recursive-build }}
          pnpm-recursive-tests: ${{ inputs.pnpm-recursive-tests }}
          pnpm-build-args: ${{ inputs.pnpm-build-args }}
          pnpm-tests-args: ${{ inputs.pnpm-tests-args }}
          test-coverage: ${{ inputs.test-coverage }}
          test-coverage-reports: ${{ inputs.test-coverage-reports }}
          test-results-reports: ${{ inputs.test-results-reports }}

      - name: Run tests
        id: test
        uses: milaboratory/github-ci/blocks/monorepo/test-pl-docker-pnpm@v4
        if: inputs.test
        env:
          PL_ADDRESS: "http://127.0.0.1:6345"
          PL_TEST_USER: ${{ env.PL_CI_TEST_USER }}
          PL_TEST_PASSWORD: ${{ env.PL_CI_TEST_PASSWORD }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ env.NPMJS_TOKEN  }}
          PNPM_VERSION: ${{ needs.metadata.outputs.pnpm-version }}
          PL_DOCKER_REGISTRY_PUSH_TO: ${{ inputs.pl-docker-registry-push-to }}
        with:
          test-script-name: ${{ inputs.test-script-name }}
          test-dry-run-script-name: ${{ inputs.test-dry-run-script-name }}
          test-skip-dry-run: ${{ inputs.test-skip-dry-run }}
          pnpm-recursive-tests: ${{ inputs.pnpm-recursive-tests }}
          pnpm-tests-args: ${{ inputs.pnpm-tests-args }}
          pl-start-service: ${{ inputs.pl-start-for-tests }}
          pl-docker-registry: ${{ format('{0}/{1}', steps.login-ecr.outputs.registry, 'pl') }}
          pl-docker-tag: ${{ inputs.pl-docker-tag }}
          pl-test-assets-dir: ${{ inputs.pl-test-assets-dir }}
          pl-log-level: ${{ inputs.pl-log-level }}
          test-coverage: ${{ inputs.test-coverage }}
          test-coverage-reports: ${{ inputs.test-coverage-reports }}
          test-results-reports: ${{ inputs.test-results-reports }}

      - name: Run build (before publish)
        uses: milaboratory/github-ci/blocks/monorepo/build-and-test-pnpm@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ env.NPMJS_TOKEN  }}
          PNPM_VERSION: ${{ needs.metadata.outputs.pnpm-version }}
          PL_DOCKER_REGISTRY_PUSH_TO: ${{ inputs.pl-docker-registry-push-to }}
        with:
          build-script-name: ${{ inputs.build-before-publish-script-name || inputs.build-script-name }}
          tests: 'false'
          test-script-name: ${{ inputs.test-script-name }}
          pnpm-recursive-build: ${{ inputs.pnpm-recursive-build }}
          pnpm-recursive-tests: ${{ inputs.pnpm-recursive-tests }}
          pnpm-build-args: ${{ inputs.pnpm-build-args }}
          pnpm-tests-args: ${{ inputs.pnpm-tests-args }}
          test-coverage: ${{ inputs.test-coverage }}
          test-coverage-reports: ${{ inputs.test-coverage-reports }}
          test-results-reports: ${{ inputs.test-results-reports }}

      # Gate publication on the images actually being in the registry. Runs on the
      # publish path only: on PRs the descriptors are not shipped anywhere, and a
      # branch build may legitimately not push.
      - name: Verify referenced docker images exist
        if: github.ref_name == 'main'
          && steps.check-changes.outputs.has-changes == '0'
          && inputs.verify-docker-images
        uses: milaboratory/github-ci/blocks/monorepo/verify-docker-images@v4

      - name: Perform security scan checks before publication
        uses: milaboratory/github-ci/actions/docker/scan-pnpm-repo@v4

      - name: Get GitHub App User ID
        if: steps.check-changes.outputs.has-changes == '1'
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit changed files to main
        uses: milaboratory/github-ci/actions/shell@v4
        if: steps.check-changes.outputs.has-changes == '1'
        env:
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          run: |
            git config --global user.name "${APP_SLUG}[bot]"
            git config --global user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com>"
            git checkout main
            git add .
            git commit -m "Auto-generated changes"
            git push

      - name: Publish npm package
        id: publish-to-private
        if: github.ref_name == 'main'
          && steps.check-changes.outputs.has-changes == '0'
          && inputs.publish-to-public == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ env.NPMJS_TOKEN }}
          PL_DOCKER_REGISTRY_PUSH_TO: ${{ inputs.pl-docker-registry-push-to }}

        uses: changesets/action@v1
        with:
          publish: pnpm -r publish --no-git-checks

      - name: Publish npm package (public)
        id: publish-to-public
        if: github.ref_name == 'main'
          && steps.check-changes.outputs.has-changes == '0'
          && inputs.publish-to-public == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ env.NPMJS_TOKEN }}
          PL_DOCKER_REGISTRY_PUSH_TO: ${{ inputs.pl-docker-registry-push-to }}

        uses: changesets/action@v1
        with:
          publish: pnpm -r publish --no-git-checks --access public

      - name: Create release with tag
        if: github.ref_name == 'main'
          && steps.check-changes.outputs.has-changes == '0'
          && inputs.create-tag == 'true'
        uses: milaboratory/github-ci/actions/release/create-with-tag@v4
        env:
          NPM_PKG_VERSION: ${{ needs.metadata.outputs.npm-pkg-version }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ format('v{0}', env.NPM_PKG_VERSION) }}
          tag: ${{ format('v{0}', env.NPM_PKG_VERSION) }}
          commit: ${{ github.sha }}
          skipIfReleaseExists: true
          draft: false
          prerelease: false

    outputs:
      # Even constant outputs become initialized only after job start.
      # All outputs of skipped jobs are always empty.
      started: 'true'

  notify-slack-release:
    name: notify slack release
    runs-on: ${{ inputs.gha-runner-label }}
    if: always() && inputs.notify-slack
    needs:
      - init
      - metadata
      - preflight-require-latest
      - preflight-pnpm-lock-sync
      - check-changesets
      - build-test-publish
      - pre-calculated-build
    steps:
      - id: search-tags
        if: always()
        uses: milaboratory/github-ci/actions/strings/json-list@v4
        with:
          input: |
            release

      - uses: milaboratory/github-ci/blocks/notify/slack/release@v4
        env:
          NPM_PKG_VERSION: ${{ needs.metadata.outputs.npm-pkg-version }}
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
          job-status: |
            ${{ needs.pre-calculated-build.result }}
            ${{ needs.build-test-publish.result }}
            ${{ needs.check-changesets.result }}
            ${{ needs.preflight-require-latest.result }}
            ${{ needs.preflight-pnpm-lock-sync.result }}
          product-name: ${{ inputs.app-name }}
          override-version: ${{ format('{0}', env.NPM_PKG_VERSION) }}
          override-tag: ${{ format('v{0}', env.NPM_PKG_VERSION) }}
          search-tags: ${{ steps.search-tags.outputs.result }}

  monitor-merge-queue-duration:
    name: monitor merge queue duration
    runs-on: ${{ inputs.gha-runner-label }}
    if: always() && inputs.cache-monitoring && github.event_name == 'merge_group'
    needs:
      - build-test-publish
    steps:
      - name: Check workflow duration
        id: check-duration
        uses: milaboratory/github-ci/actions/shell@v4
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          DURATION_THRESHOLD_MINUTES: ${{ inputs.cache-monitoring-duration-minutes }}
        with:
          run: |
            echo "=== Merge Queue Duration Monitoring ==="

            # Get workflow run start time from GitHub API (most reliable source)
            RUN_STARTED_AT=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq '.run_started_at')

            if [ -z "${RUN_STARTED_AT}" ] || [ "${RUN_STARTED_AT}" = "null" ]; then
              echo "::error::Failed to get workflow run start time from GitHub API"
              exit 1
            fi

            echo "Workflow started at: ${RUN_STARTED_AT}"

            # Convert ISO 8601 timestamp to epoch seconds
            START_EPOCH=$(date -d "${RUN_STARTED_AT}" +%s)
            CURRENT_EPOCH=$(date +%s)
            DURATION_SECONDS=$((CURRENT_EPOCH - START_EPOCH))
            DURATION_MINUTES=$((DURATION_SECONDS / 60))
            
            echo "Workflow duration: ${DURATION_MINUTES} minutes (${DURATION_SECONDS} seconds)"
            echo "Duration threshold: ${DURATION_THRESHOLD_MINUTES} minutes"
            
            if [ "${DURATION_MINUTES}" -gt "${DURATION_THRESHOLD_MINUTES}" ]; then
              echo ""
              echo "::warning::Merge queue run took ${DURATION_MINUTES} minutes, exceeding threshold of ${DURATION_THRESHOLD_MINUTES} minutes"
              echo "::notice::This may indicate Turbo cache issues or other performance problems"
              ghwa_set_output "alert" "true"
              ghwa_set_output "duration_minutes" "${DURATION_MINUTES}"
            else
              echo ""
              echo "✅ Merge queue duration is within threshold (${DURATION_MINUTES}/${DURATION_THRESHOLD_MINUTES} minutes)"
              ghwa_set_output "alert" "false"
              ghwa_set_output "duration_minutes" "${DURATION_MINUTES}"
            fi

      - name: Send Slack notification for slow merge queue
        if: fromJSON(steps.check-duration.outputs.data).alert == 'true' && inputs.notify-slack
        uses: milaboratory/github-ci/actions/notify/slack/send@v4
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          method: chat.postMessage
          payload: |
            {
              "channel": "${{ secrets.SLACK_CHANNEL }}",
              "text": "⚠️ Slow Merge Queue Alert: ${{ github.repository }} took ${{ fromJSON(steps.check-duration.outputs.data).duration_minutes }} minutes (threshold: ${{ inputs.cache-monitoring-duration-minutes }} min)",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "⚠️ Slow Merge Queue Alert"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ github.repository }}* merge queue took *${{ fromJSON(steps.check-duration.outputs.data).duration_minutes }} minutes*"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Threshold:*\n${{ inputs.cache-monitoring-duration-minutes }} minutes"},
                    {"type": "mrkdwn", "text": "*Workflow:*\n${{ github.workflow }}"}
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*This may indicate:*\n• Turbo remote cache not working\n• Cache invalidation issues\n• Infrastructure performance problems"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Recommended actions:*\n• Check Turbo cache configuration\n• Verify S3 bucket connectivity\n• Review recent changes that may have invalidated cache"
                  }
                }
              ]
            }
