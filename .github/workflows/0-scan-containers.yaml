# This workflow is never used by any external repository.
# It is created solely for testing purposes when developing new actions.
# Feel free to change it however you want.
name: "Scan containers"

on:
  push:
    paths:
      - '.github/workflows/0-scan-containers.yaml'
      - 'actions/docker/scan-docker-repo/**'
    branches: [ 'v4-beta' ]

  workflow_dispatch:
    inputs:
      image:
        description: |
          Scan a single image instead of the whole registry.
          Provide a full image reference, i.e.
          'containers.pl-open.science/milaboratories/pl-containers:sometag'.
          When set, 'registry'/'repository'/'concurrency' are ignored.
        type: string
        default: ''
      registry:
        description: |
          Docker registry to scan (full-registry mode only).
        type: string
        default: 'containers.pl-open.science'
      repository:
        description: |
          Repository to scan (full-registry mode only).
        type: string
        default: 'milaboratories/pl-containers'
      concurrency:
        description: |
          Number of concurrent jobs to plan (full-registry mode only).
        type: number
        default: 50

jobs:
  # Single-image mode: scan just the image given in the 'image' input.
  scan-single:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.image != ''

    steps:
      - name: Prepare tag file
        shell: bash
        env:
          IMAGE: ${{ github.event.inputs.image }}
        run: |
          mkdir -p scan-chunks
          printf '%s\n' "${IMAGE}" > scan-chunks/single-image

      - uses: milaboratory/github-ci/actions/docker/scan-docker-repo@v4
        with:
          mode: scan
          report-name: "report-single-image"
          tag-file: scan-chunks/single-image

          # Not used in scan mode, but declared as required by the action.
          registry: ${{ github.event.inputs.registry || 'containers.pl-open.science' }}
          repository: ${{ github.event.inputs.repository || 'milaboratories/pl-containers' }}

  plan:
    runs-on: ubuntu-latest
    # Full-registry mode: skipped when a single image is requested.
    if: github.event.inputs.image == ''

    steps:
      - uses: milaboratory/github-ci/actions/docker/scan-docker-repo@v4
        id: plan
        with:
          mode: plan
          report-name: "skipped-images"

          registry: ${{ github.event.inputs.registry || 'containers.pl-open.science' }}
          repository: ${{ github.event.inputs.repository || 'milaboratories/pl-containers' }}
          concurrency: ${{ github.event.inputs.concurrency || 3 }}

      - uses: actions/upload-artifact@v4
        with:
          name: 00-scanning-plan
          path: ${{ steps.plan.outputs.plan-dir }}

    outputs:
      plan-dir: ${{ steps.plan.outputs.plan-dir }}
      plan-matrix: ${{ steps.plan.outputs.plan-matrix }}

  scan:
    runs-on: ubuntu-latest
    name: scan ${{ matrix.plan-file }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.plan-matrix) }}

    steps:
      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: 00-scanning-plan
          path: "scan-chunks"

      - shell: bash
        run: |
          # Random sleep to avoid limiting on trivy side
          sl=$((RANDOM % 10))
          sleep ${sl}

      - uses: milaboratory/github-ci/actions/docker/scan-docker-repo@v4
        with:
          mode: scan
          report-name: "report-${{ matrix.plan-file }}"
          tag-file: scan-chunks/${{ matrix.plan-file }}
          limit: ${{ github.event.inputs && 100000 || 2 }} # limit scanning to 2 images for automatic runs to speedup script development

  collect:
    runs-on: ubuntu-latest
    needs: [scan, scan-single]
    if: always()
    steps:
      - name: Download skipped list
        # Only produced by the full-registry 'plan' job.
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: skipped-images
          path: ./consolidated

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          pattern: 'report-*'
          merge-multiple: true
          path: ./consolidated

      - name: Summarize all reports
        uses: milaboratory/github-ci/actions/docker/scan-docker-repo@v4
        with:
          mode: summarize
          summarize-dir: ./consolidated

      - name: Upload consolidated report
        uses: actions/upload-artifact@v4
        with:
          name: 00-consolidated-report
          path: ./consolidated
