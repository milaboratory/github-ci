name: Block review
# node-simple-pnpm.yaml calls it on every PR. It reviews only when the PR has the ai-review label.
on:
  workflow_call:
    secrets:
      env:
        description: |
          The same JSON-encoded map of secret env variables as node-simple-pnpm.yaml gets.
          It must hold ANTHROPIC_API_KEY. REVIEWRULES_RULE_SETS_TOKEN is optional: a token
          that can read private rule set repos.
        required: false

env:
  REVIEW_LABEL: ai-review

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: block-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # A re-run gets the labels of the first run, so read the labels the PR has now.
      - name: Check the review label
        id: label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const requested = labels.some((label) => label.name === process.env.REVIEW_LABEL);
            core.setOutput('requested', String(requested));
            if (!requested) core.notice(`Add the label ${process.env.REVIEW_LABEL} and push or re-run this job to get a review.`);

      - uses: milaboratory/github-ci/actions/env@v4-beta
        if: steps.label.outputs.requested == 'true'
        with:
          inputs: '{}'
          secrets: ${{ secrets.env || '{}' }}

      - name: Check the Anthropic API key
        if: steps.label.outputs.requested == 'true'
        shell: bash
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is missing. Add it to secrets.env in .github/workflows/build.yaml, the same way as NPMJS_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.label.outputs.requested == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Add a rule folder when the repo has none
        if: steps.label.outputs.requested == 'true' && hashFiles('.reviewrules/config.json') == ''
        shell: bash
        run: |
          mkdir -p .reviewrules
          cat > .reviewrules/config.json <<'JSON'
          {
            "ignorePatterns": "**/node_modules/**\n**/dist/**\n**/block-pack/**\n**/.turbo/**\n**/*.tgz\n**/CHANGELOG.md\nsoftware/**/uv.lock\nsoftware/**/src/requirements.txt\nsoftware/**/tests/data/corpus/**\ntest/fixtures/data/**\n**/__pycache__/**",
            "rules": []
          }
          JSON

      - uses: milaboratory/github-ci/actions/review/reviewrules@v4-beta
        if: steps.label.outputs.requested == 'true'
        with:
          anthropic-api-key: ${{ env.ANTHROPIC_API_KEY }}
          rule-sets-token: ${{ env.REVIEWRULES_RULE_SETS_TOKEN || github.token }}
          settings: |
            [[rule_sets]]
            name = "block"
            url = "https://github.com/milaboratory/block-review-rules.git"
            ref = "v0.1.0"
