name: Block review
# Runs as a required workflow of an organization ruleset, so block repos need no change.
# A ruleset workflow starts only on PR opened, synchronize, and reopened. After you add
# the label, re-run this workflow, or push a new commit.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: block-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  REVIEW_LABEL: ai-review

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # A re-run gets the labels of the first run, so read the labels the PR has now.
      - name: Check the review label
        id: label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const requested = labels.some((label) => label.name === process.env.REVIEW_LABEL);
            core.setOutput('requested', String(requested));
            if (!requested) core.notice(`Add the label ${process.env.REVIEW_LABEL} and re-run this workflow to get a review.`);

      - uses: actions/checkout@v4
        if: steps.label.outputs.requested == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Add the block rule set when the repo has no rule folder
        if: steps.label.outputs.requested == 'true' && hashFiles('.reviewrules/config.json') == ''
        shell: bash
        run: |
          mkdir -p .reviewrules
          cat > .reviewrules/settings.toml <<'TOML'
          [[rule_sets]]
          name = "block"
          url = "https://github.com/milaboratory/block-review-rules.git"
          ref = "v0.1.0"
          TOML
          cat > .reviewrules/config.json <<'JSON'
          {
            "ignorePatterns": "**/node_modules/**\n**/dist/**\n**/block-pack/**\n**/.turbo/**\n**/*.tgz\n**/CHANGELOG.md\nsoftware/**/uv.lock\nsoftware/**/src/requirements.txt\nsoftware/**/tests/data/corpus/**\ntest/fixtures/data/**\n**/__pycache__/**",
            "rules": []
          }
          JSON

      - uses: milaboratory/github-ci/actions/review/reviewrules@v4-beta
        if: steps.label.outputs.requested == 'true'
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          rule-sets-token: ${{ secrets.REVIEWRULES_RULE_SETS_TOKEN || github.token }}
