name: Greptile auto-approve
author: 'MiLaboratories'
description: |
  Approve a pull request on behalf of github-actions[bot] when the latest Greptile
  confidence score in the PR description is at least `min-score` and the PR touches
  no protected path. Otherwise dismiss the approvals the bot gave earlier, so a push
  that touches a protected path or a lower score takes the approval back.
  Every run posts its decision as a PR comment. While an open PR touches a protected
  path, it has the "AUTOREVIEW: RESTRICTED" label; the label goes away when the PR
  touches none again. The action never edits the PR description.

  The score is trusted only when Greptile made the last edit of the PR description,
  and it is trusted even when Greptile reviewed an older commit. The changed files
  are always checked at the PR head.

  The protected list is read from the base branch through the API, so a PR cannot
  change the list it is checked against, and the caller needs no checkout. The
  action checks each changed path, and the old path of a renamed file, with the
  @actions/glob globber (followSymbolicLinks: false, implicitDescendants: true,
  matchDirectories: false). Rules of the list:
  - One pattern on each line, relative to the repository root. A line that starts
    with '#' is a comment. A '#' after a pattern is part of the pattern.
  - A pattern that starts with '/' or '~', or that has a '..' segment, is an error:
    the action then protects all paths and the job fails.
  - '*' and '?' do not match '/'. '**' matches any number of directories.
    '[abc]' matches one of the characters. Braces and extglob are not supported.
  - A pattern that matches a directory also matches all files in it:
    'dir', 'dir/', 'dir/*' and 'dir/**' all protect the full directory.
    '*.sh' matches only the .sh files in the root; use '**/*.sh' for all of them.
  - A '!' line excludes paths. The last line that matches a path wins, so put a
    '!' line after the lines it limits.
  - Matching is case-insensitive.

  Call it from a `pull_request_target` workflow with `pull-requests: write`, on
  `opened, edited, synchronize, reopened, ready_for_review, converted_to_draft`:
  Greptile writes its score into the PR description, which fires `edited`.
  The repository must allow GitHub Actions to approve pull requests.

inputs:
  protected-paths:
    description: |
      Path of the protected list in the repository, read from the PR base branch.
    required: false
    default: '.github/greptile-auto-approve-protected.txt'
  min-score:
    description: Lowest Greptile confidence score (1-5) that approves.
    required: false
    default: '4'
  dry-run:
    description: "'true' prints the decision and changes nothing."
    required: false
    default: 'false'
  github-token:
    description: GitHub token with pull-requests:write permission.
    required: false
    default: ${{ github.token }}

runs:
  using: 'node24'
  main: 'lib/index.js'
