name: Prepare environment for NodeJS PNPM
author: 'MiLaboratories'
description: |
  Prepare environment: install specific version of Node, restore cache for modules.

inputs:
  node-version:
    description: |
      Node version to use.
      Examples: '16.x', '14.x'
    required: true

  cache-version:
    description: |
      Simple hack, that allows to 'reset' cache for particular job.

      Just change the value of this parameter and the next run will
      not find build cache and will have to start from scratch.

    required: false
    default: 'v1'

  cache-hashfiles-search-path:
    description: |
      Hashfiles search path for pnpm-lock.yaml
    required: false
    default: '**/pnpm-lock.yaml'

  pnpm-version:
    description: |
      Version of pnpm to install.
      Leave empty to use version from packageManager field in package.json.
    required: false
    default: ''

  npmrc-config:
    description: |
      Generates a .npmrc file based on provided configuration.
    required: false

  # --- Opt-in RGW/S3 pnpm store cache (self-hosted hz runners). When these keys are
  #     set, the pnpm store is cached in RGW (node/cache-pnpm-s3, GitHub-cache fallback);
  #     otherwise the GitHub-hosted cache is used unchanged. Bucket/endpoint/region
  #     default inside cache-pnpm-s3 (ci-actions-cache / s3.hz.platforma.bio / us-east-1).
  cache-s3-access-key:
    description: |
      S3/RGW access key for the pnpm store cache (e.g. org secret HZ_CI_CACHE_S3_ACCESS_KEY).
      Empty = use the GitHub-hosted cache.
    required: false
    default: ''
  cache-s3-secret-key:
    description: |
      S3/RGW secret key for the pnpm store cache (e.g. org secret HZ_CI_CACHE_S3_SECRET_KEY).
    required: false
    default: ''

runs:
  using: "composite"

  steps:
    - name: Install NodeJS - ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Re-Write .npmrc config
      uses: milaboratory/github-ci/actions/utils/create-npmrc@v4-beta
      if: inputs.npmrc-config != ''
      with:
        npmrcConfig: ${{ inputs.npmrc-config }}

    - name: Install pnpm - ${{ inputs.pnpm-version }}
      if: inputs.pnpm-version != ''
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Install pnpm from packageManager field in package.json
      if: inputs.pnpm-version == ''
      shell: bash
      run: corepack enable pnpm

    - name: Set up pnpm store cache (GitHub)
      if: inputs.cache-s3-access-key == ''
      uses: milaboratory/github-ci/actions/node/cache-pnpm@v4-beta
      with:
        cache-hashfiles-search-path: ${{ inputs.cache-hashfiles-search-path }}
        cache-version: ${{ inputs.cache-version }}

    - name: Set up pnpm store cache (RGW / S3)
      if: inputs.cache-s3-access-key != ''
      uses: milaboratory/github-ci/actions/node/cache-pnpm-s3@v4-beta
      with:
        access-key: ${{ inputs.cache-s3-access-key }}
        secret-key: ${{ inputs.cache-s3-secret-key }}
        cache-hashfiles-search-path: ${{ inputs.cache-hashfiles-search-path }}
        cache-version: ${{ inputs.cache-version }}
