name: Pack unpublished workspace packages
author: 'MiLaboratories'
description: |
  First half of a split npm publish: everything `pnpm -r publish` does except
  the registry upload. The upload runs later in `publish-tarballs` on a
  GitHub-hosted runner, because npm trusted publishing (OIDC) does not accept
  self-hosted runners.

  For every non-private workspace package whose version is not in its registry
  yet, in topological order:
    1. `pnpm run --if-present prepublishOnly`. pnpm pack does not run it, and
       blocks rely on it (`block-tools publish` to the block registry,
       `pl-pkg prepublish` for software packages).
    2. `pnpm pack` into `output-dir`. pnpm resolves `workspace:` and `catalog:`
       here, so the tarball is final.
    3. Append a line to `output-dir/manifest.jsonl` with the registry, dist-tag
       and access the upload needs: `npm publish <tarball>` ignores
       `publishConfig` inside the tarball.

  `publish` and `postpublish` scripts would run after the upload under
  `pnpm publish`. The split cannot honour that, so a package that defines one
  fails the step.

  Expects the workspace `.npmrc` (create-npmrc) at GITHUB_WORKSPACE, with its
  token env vars set, so registry lookups resolve scopes and auth.

inputs:
  output-dir:
    description: |
      Directory for tarballs and manifest.jsonl. Defaults to
      $RUNNER_TEMP/npm-tarballs. Emptied before packing.
    required: false
    default: ''

outputs:
  dir:
    description: Directory holding the tarballs and manifest.jsonl.
    value: ${{ steps.pack.outputs.dir }}
  count:
    description: Number of packed packages ('0' when everything is already published).
    value: ${{ steps.pack.outputs.count }}

runs:
  using: "composite"

  steps:
    - name: Pack unpublished packages
      id: pack
      shell: bash
      env:
        OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail

        OUT_DIR="${OUTPUT_DIR:-${RUNNER_TEMP}/npm-tarballs}"
        rm -rf "${OUT_DIR}"
        mkdir -p "${OUT_DIR}"
        : > "${OUT_DIR}/manifest.jsonl"

        per_package="$(mktemp)"
        cat > "${per_package}" <<'SCRIPT'
        set -euo pipefail

        if [ "$(jq -r '.private // false' package.json)" = "true" ]; then
          exit 0
        fi

        name="$(jq -r '.name' package.json)"
        version="$(jq -r '.version' package.json)"

        for script in publish postpublish; do
          if jq -e --arg s "${script}" '.scripts[$s] // empty' package.json >/dev/null; then
            echo "::error::${name}: '${script}' script is not supported by the split publish (it would run after the upload on another runner)"
            exit 1
          fi
        done

        # Resolve the registry the way pnpm does: publishConfig.registry, then the
        # scope mapping, then the default. Run npm from the workspace root so it
        # reads the generated .npmrc rather than looking next to this package.
        registry="$(jq -r '.publishConfig.registry // empty' package.json)"
        if [ -z "${registry}" ] && [[ "${name}" == @*/* ]]; then
          registry="$(cd "${GITHUB_WORKSPACE}" && npm config get "${name%%/*}:registry")"
          [ "${registry}" = "undefined" ] && registry=""
        fi
        if [ -z "${registry}" ]; then
          registry="$(cd "${GITHUB_WORKSPACE}" && npm config get registry)"
        fi

        # Exit 0 + empty output: package exists, version does not.
        # E404: package does not exist. Anything else is a real failure.
        if view_out="$(cd "${GITHUB_WORKSPACE}" && npm view "${name}@${version}" version --registry "${registry}" 2>&1)"; then
          if [ -n "${view_out}" ]; then
            echo "${name}@${version}: already in ${registry}, skipping"
            exit 0
          fi
        elif ! grep -q 'E404' <<<"${view_out}"; then
          echo "${view_out}"
          echo "::error::${name}@${version}: cannot check ${registry}"
          exit 1
        fi

        echo "::group::${name}@${version} -> ${registry}"
        pnpm run --if-present prepublishOnly
        # pack prints prepack/prepare output first and the tarball path last;
        # tee keeps the script output in the log.
        tarball="$(pnpm pack --pack-destination "${OUT_DIR}" | tee /dev/stderr | tail -n 1)"
        echo "::endgroup::"

        if [ ! -f "${tarball}" ]; then
          echo "::error::${name}@${version}: pnpm pack did not report a tarball (got '${tarball}')"
          exit 1
        fi

        jq -nc \
          --arg name "${name}" \
          --arg version "${version}" \
          --arg file "$(basename "${tarball}")" \
          --arg registry "${registry}" \
          --arg tag "$(jq -r '.publishConfig.tag // empty' package.json)" \
          --arg access "$(jq -r '.publishConfig.access // empty' package.json)" \
          '{name: $name, version: $version, file: $file, registry: $registry, tag: $tag, access: $access}' \
          >> "${OUT_DIR}/manifest.jsonl"
        SCRIPT

        # exec runs packages in topological order; concurrency 1 keeps the
        # manifest in that order, so dependencies are uploaded first.
        OUT_DIR="${OUT_DIR}" pnpm -r --workspace-concurrency=1 exec bash "${per_package}"

        count="$(wc -l < "${OUT_DIR}/manifest.jsonl" | tr -d ' ')"
        echo "Packed ${count} package(s):"
        cat "${OUT_DIR}/manifest.jsonl"

        echo "dir=${OUT_DIR}" >> "${GITHUB_OUTPUT}"
        echo "count=${count}" >> "${GITHUB_OUTPUT}"
