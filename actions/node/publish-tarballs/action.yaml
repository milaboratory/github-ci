name: Publish packed npm tarballs
author: 'MiLaboratories'
description: |
  Second half of a split npm publish: uploads the tarballs that
  `pack-unpublished` produced, in manifest order. Must run on a GitHub-hosted
  runner in a job with `id-token: write`: npm trusted publishing (OIDC) does
  not accept self-hosted runners.

  registry.npmjs.org authenticates through OIDC (`npmjs-fallback-token` as an
  optional fallback); npm.pkg.github.com through `npm-auth-token`. Any other
  registry fails the step before the first upload. Implemented in
  ../npm-split-publish (TypeScript, src/publish.ts).

inputs:
  dir:
    description: Directory with the tarballs and manifest.jsonl.
    required: true

  access-public:
    description: |
      'true' publishes with `--access public`, as `pnpm -r publish --access public`
      did. Otherwise the package's publishConfig.access, if any, is used.
    required: false
    default: 'false'

  node-version:
    description: Node.js version for the upload.
    required: false
    default: '24'

  npm-version:
    description: |
      npm version to install. Trusted publishing needs 11.5.1 or later.
    required: false
    default: '^11.5.1'

  npm-auth-token:
    description: Token for npm.pkg.github.com (GitHub Packages). Sent to no other registry.
    required: false
    default: ''

  npmjs-fallback-token:
    description: |
      Legacy registry.npmjs.org token, used only when the OIDC exchange fails.
      Leave empty to require trusted publishing.
    required: false
    default: ''

runs:
  using: "composite"

  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install npm
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm-version }}
      run: |
        npm install --global "npm@${NPM_VERSION}"
        npm --version

    - name: Publish tarballs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARBALL_DIR: ${{ inputs.dir }}
        ACCESS_PUBLIC: ${{ inputs.access-public }}
        NPM_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
        NPMJS_FALLBACK_TOKEN: ${{ inputs.npmjs-fallback-token }}
      run: node "${ACTION_PATH}/../npm-split-publish/lib/publish/index.js"
