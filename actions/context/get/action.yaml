name: Get data from context.
author: 'MiLaboratories'
description: |
  Get from context data stored by prevoius jobs.
  Consider context as key-value store with immutable values.
  Once stored under specific key, the value can not be changed.

  NOTE: for large files use 'cache' GitHub Actions functionality
        as 'context' bases on 'artifacts' and is slow on big files.

inputs:
  default-value:
    description: |
      Default value to return when the context artifact is missing.

      When set (non-empty), the action returns this value and succeeds.
      When left empty, a missing context is treated as an error: the action
      fails with a clear message instead of returning an empty value.

    required: false
    default: ''

  github-token:
    description: |
      Optional token enabling cross-attempt artifact lookup.

      Leave empty (default) to read the context uploaded in the CURRENT run
      attempt via the runtime service — no extra permission needed.

      Set it (e.g. to ${{ github.token }}) to switch 'download-artifact' to its
      GitHub API code path, which resolves artifacts at the workflow-run level
      (across ALL run attempts). This lets a job read a 'context' uploaded in an
      earlier attempt of the same run — e.g. after a manual gate + re-run of
      failed jobs. When set, the calling job must also grant 'actions: read'.

    required: false
    default: ''

outputs:
  value:
    description:
      The value loaded from context
    value: ${{ steps.value.outputs.data }}

runs:
  using: "composite"

  steps:
    - id: needs_update
      uses: milaboratory/github-ci/actions/shell@v4-beta
      env:
        CTX_PATH: ${{ github.action_path }}/../ctx

      with:
        run: |
          if [ ! -e "${CTX_PATH}" ]; then
            echo 'true'
            exit 0
          fi

          echo 'false'

    - uses: actions/download-artifact@v6
      # When 'github-token' is set, the action uses its API lookup path, which
      # finds the 'context' artifact at the run level regardless of which run
      # attempt uploaded it (needed for reads after a manual gate + re-run).
      # When empty, it searches only the current attempt (default behaviour,
      # no 'actions: read' permission required).
      #
      # If the artifact is genuinely absent this step fails; the 'value' step
      # below (if: always()) then turns that into a clear error or the default.
      if: steps.needs_update.outputs.stdout == 'true'
      with:
        name: context
        path: ${{ github.action_path }}/../ctx
        run-id: ${{ github.run_id }}
        github-token: ${{ inputs.github-token }}

    - id: value
      if: always()
      shell: bash

      env:
        CTX_PATH: ${{ github.action_path }}/../ctx
        DEFAULT_VALUE: ${{ inputs.default-value }}

      run: |
        # Read context or default value into outputs
        ctx_file="${CTX_PATH}/context.json"

        delimiter="CTXEOF_aim3ohghohh2ohkahfaeq" # unique-enough to never intersect with data

        emit_data() {
          {
            echo "data<<${delimiter}"
            printf '%s\n' "$1"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
        }

        if [ -r "${ctx_file}" ]; then
          emit_data "$(cat "${ctx_file}")"
          exit 0
        fi

        if [ -n "${DEFAULT_VALUE}" ]; then
          emit_data "${DEFAULT_VALUE}"
          exit 0
        fi

        # (1) Context artifact missing and no default-value provided: fail loudly
        # with a clear message. Still emit a valid-JSON sentinel ('{}') so that a
        # downstream fromJSON() reading this output degrades to empty fields
        # instead of the cryptic "Error reading JToken ... template is not valid".
        emit_data "{}"
        echo "::error title=context artifact not found::The 'context' artifact was not found and no default-value was provided. It is created by 'actions/context/init' — make sure it runs earlier in this workflow run. When reading after a re-run, the calling job must grant 'actions: read' permission so the artifact can be fetched across run attempts."
        exit 1
