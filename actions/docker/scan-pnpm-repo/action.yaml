name: Scan images built by pnpm monorepo
author: 'MiLaboratories'
description: |
  Scan software images that are part of pnpm monorepo.
  Checks all npm packages in monorepo and gets docker images of all software packages.
  Scans all images for CVEs and misconfigurations.

inputs:
  #
  # Scan target settings
  #
  package-paths:
    description: |
      Selective scan mode: instead of automatic software packages detection in workspace,
      selectively scan packages located in given directories.
    required: true

  #
  # Scan settings
  #
  pkg-types:
    description: |
      Type of packages to scan.
    required: false
    default: 'os,library'
  scanners:
    description: |
      Scanners to use.
    required: false
    default: 'vuln,secret,misconfig'
  severity:
    description: |
      Severity of vulnerabilities to scan.
    required: false
    default: 'HIGH,CRITICAL'
  ignore-unfixed:
    description: |
      Ignore unfixed vulnerabilities.
    required: false
    default: 'false'

  #
  # Report settings
  #
  report-format:
    description: |
      Format of the report.
    required: false
    default: 'json'

outputs:
  report-file:
    description: |
      Scan report file path.
    value: ${{ steps.init.outputs.report-file }}

runs:
  using: "composite"

  steps:
    - name: Install Trivy
      id: init
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKSPACE_PATH: ${{ runner.workspace }}
      run: |
        trivy_dir="${WORKSPACE_PATH}/trivy"
        mkdir -p "${trivy_dir}"
        # Download the pinned release straight from GitHub Releases and verify its
        # sha256. Do not use contrib/install.sh: it fetches tarballs via
        # get.trivy.dev, an extra domain outside our control that has already
        # gone unresolvable and broke every scan.
        trivy_version="0.69.3"
        case "$(uname -m)" in
          x86_64)  trivy_arch="64bit"; trivy_sha256="1816b632dfe529869c740c0913e36bd1629cb7688bd5634f4a858c1d57c88b75" ;;
          aarch64) trivy_arch="ARM64"; trivy_sha256="7e3924a974e912e57b4a99f65ece7931f8079584dae12eb7845024f97087bdfd" ;;
          *) echo "::error::Unsupported runner architecture for Trivy: $(uname -m)"; exit 1 ;;
        esac
        trivy_tarball="trivy_${trivy_version}_Linux-${trivy_arch}.tar.gz"
        curl -fsSL --retry 3 -o "${trivy_dir}/${trivy_tarball}" \
          "https://github.com/aquasecurity/trivy/releases/download/v${trivy_version}/${trivy_tarball}"
        echo "${trivy_sha256}  ${trivy_dir}/${trivy_tarball}" | sha256sum -c -
        tar -xzf "${trivy_dir}/${trivy_tarball}" -C "${trivy_dir}" trivy
        rm -f "${trivy_dir}/${trivy_tarball}"

        trivy_bin="${trivy_dir}/trivy"
        report_file="${trivy_dir}/report-file"
        skipped_file="${trivy_dir}/skipped-file"

        "${trivy_bin}" version

        echo "trivy=${trivy_bin}" >> "${GITHUB_OUTPUT}"
        echo "report-file=${report_file}" >> "${GITHUB_OUTPUT}"
        echo "skipped-file=${skipped_file}" >> "${GITHUB_OUTPUT}"

    - name: Post save report
      uses: milaboratory/github-ci/actions/post/artifact@v4
      with:
        name: trivy-report
        archive: true
        path: |
          ${{ steps.init.outputs.report-file }}
          ${{ steps.init.outputs.skipped-file }}

    - name: Scan workspace
      id: scan-packages
      shell: bash
      env:
        PATHS_TO_SCAN: ${{ inputs.package-paths }}
        ACTION_PATH: ${{ github.action_path }}
        SKIPPED_LIST_FILE: ${{ steps.init.outputs.skipped-file }}

        TRIVY_BIN: ${{ steps.init.outputs.trivy }}
        PKG_TYPES: ${{ inputs.pkg-types }}
        SCANNERS: ${{ inputs.scanners }}
        SEVERITY: ${{ inputs.severity }}
        IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}

        REPORT_FORMAT: ${{ inputs.report-format }}
        REPORT_FILE: ${{ steps.init.outputs.report-file }}
      run: |
        "${ACTION_PATH}/scan-workspace.sh"
