name: Check changeset coverage
author: 'MiLaboratories'
description: |
  Fail if a PR's changesets don't cover every published workspace package it
  changes. A package is changed when the PR edits a file inside its directory,
  or when the PR changes a catalog entry in pnpm-workspace.yaml that the
  package references via `catalog:` from `dependencies` or `peerDependencies`.
  A catalog entry referenced only from `devDependencies` or
  `optionalDependencies` requires nothing.

  Changes are counted from the merge base with the base branch, so commits that
  landed on the base branch after the PR branched off are not the PR's.

  An empty changeset (`pnpm changeset --empty`) added in the branch is a
  deliberate, in-repo "no release needed" opt-out and waives the requirement for
  every missing package at once — the same rule require-package-bump applies to
  its own half of the gate. A stale empty changeset already on the base branch
  does not count.

  This action is label-agnostic; the `skip-changelog` bypass is handled by the
  caller workflow's job-level `if` (PR labels are only available on
  `pull_request` events).

  Runs after `pnpm install`. Requires `git`, `pnpm`, `jq` and `yq` (mikefarah,
  v4+) on PATH. `git` needs full history (`fetch-depth: 0`) to find the merge
  base with the base branch.

inputs:
  base-branch:
    description: Base branch to diff against (e.g. main).
    required: true

runs:
  using: 'composite'

  steps:
    - name: Check changeset coverage
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE_BRANCH: ${{ inputs.base-branch }}
      run: '${ACTION_PATH}/check-coverage.sh'
