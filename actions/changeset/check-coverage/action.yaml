name: Check changeset coverage
author: 'MiLaboratories'
description: |
  Fail if a PR's changesets don't cover every workspace package whose own
  files it edits — e.g. editing block code under packages/<pkg>/ without
  adding that package to the changeset.

  Dependency-version bumps are intentionally NOT flagged, including catalog
  bumps in pnpm-workspace.yaml. A catalog entry always pins an external
  package, and `pnpm changeset` never requires a release for an external
  dependency bump — it propagates versions through the internal dependency
  chain automatically at `changeset version` time. Flagging consumers of a
  bumped catalog dependency would over-report relative to `pnpm changeset`.

  An empty changeset (`pnpm changeset --empty`) added in the branch is a
  deliberate, in-repo "no release needed" opt-out and waives the requirement for
  every missing package at once — the same rule require-package-bump applies to
  its own half of the gate. A stale empty changeset already on the base branch
  does not count.

  This action is label-agnostic; the `skip-changelog` bypass is handled by the
  caller workflow's job-level `if` (PR labels are only available on
  `pull_request` events).

  Runs after `pnpm install`. Requires the runner to have `pnpm`, `jq` and `git`
  on PATH — all pre-installed on GitHub-hosted ubuntu-latest images. `git` needs
  full history (`fetch-depth: 0`) to see which changesets the branch added.

inputs:
  base-branch:
    description: Base branch to diff against (e.g. main).
    required: true

runs:
  using: 'composite'

  steps:
    - name: Check changeset coverage
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE_BRANCH: ${{ inputs.base-branch }}
      run: '${ACTION_PATH}/check-coverage.sh'
