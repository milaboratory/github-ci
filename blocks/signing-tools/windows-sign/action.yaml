name: Sign application on Windows
author: 'MiLaboratories'
description: |
  Sign Windows executable

inputs:
  #
  # jsign control
  #
  java-version:
    description: |
      Version of JAVA to to launch ebourg/jsign.
    required: false
    default: '11'

  java-distribution:
    description: |
      Java distribution to use.
      Example: 'temurin', 'zulu', ...
      See 'https://github.com/actions/setup-java#supported-distributions'
      for complete list of supported distributions.
    required: false
    default: 'temurin'

  jsign-version:
    description: |
      Version of jsign
    required: false
    default: '6.0'

  store-type:
    description: |
      type of the store with certificate (the cloud service to use)
    required: false
    default: GOOGLECLOUD

  timestamping-mode:
    description: |
      Timestamping mode
    required: false
    default: 'RFC3161'

  timestamping-url:
    description: |
      Timestamping url, must be from the organization that issued code sign certificate
    required: false
    default: 'http://timestamp.globalsign.com/tsa/r6advanced1'

  binaries:
    description: |
      Files to sign with jsign. One per line
      Each path can be a globbing pattern.
      Only files are matched, implicit-descendants is disabled
      (use /* or /** pattern ending to match all files inside directory)
    required: false

  code-sign-chain:
    description: |
      base64-encoded code sign chain pem file for the Windows
    required: false

  kms-keyring:
    description: |
       KMS keyring name in GCP. Used only with backend 'gcp'.
    required: false

  kms-keyname:
    description: |
      KMS key name in GCP. Used only with backend 'gcp'.
    required: false

  access-token:
    description: |
      Access token for certificate store. Used only with backend 'gcp':
      the 'azure' backend gets its own token through OIDC login.
    required: false

  #
  # Azure Trusted Signing control
  #
  backend:
    description: |
      Windows signing backend: 'gcp' (Google Cloud HSM, default) or 'azure'
      (Azure Trusted Signing). 'azure' needs 'id-token: write' on the calling job
      and a federated credential for the calling repository on the Entra app.
    required: false
    default: 'gcp'

  azure-client-id:
    description: Microsoft Entra application (client) ID for Azure Trusted Signing OIDC login.
    required: false
    default: '41a3655d-2ac4-4bd0-86e2-839a38b6cb58'

  azure-tenant-id:
    description: Microsoft Entra tenant ID for Azure Trusted Signing OIDC login.
    required: false
    default: '53dff85f-903c-48f0-908b-00aa35e40dad'

  azure-codesign-endpoint:
    description: Azure Trusted Signing regional endpoint (abbreviated region code, e.g. 'eus' for East US).
    required: false
    default: 'https://eus.codesigning.azure.net'

  azure-codesign-account:
    description: Azure Trusted Signing account name.
    required: false
    default: 'platforma-app-signing'

  azure-codesign-profile:
    description: Azure Trusted Signing certificate profile name.
    required: false
    default: 'platforma-public-trust'

  # interactive-debug:
  #   description: |
  #     Break execution and start interactive debugging session with server VSCode right on agent
  #   required: false
  #   default: 'false'

runs:
  using: "composite"

  steps:
    - uses: milaboratory/github-ci/actions/files/list@v4-beta
      id: binaries-list
      with:
        patterns: ${{ inputs.binaries }}
        relative: true
        match-directories: false

    # - uses: fawazahmed0/action-debug-vscode@main
    #   if: inputs.interactive-debug == 'true'

    - name: Install Java
      if: steps.binaries-list.outputs.has-matches == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Azure login (Trusted Signing)
      if: steps.binaries-list.outputs.has-matches == 'true'
        && inputs.backend == 'azure'
      uses: azure/login@v2
      with:
        client-id: ${{ inputs.azure-client-id }}
        tenant-id: ${{ inputs.azure-tenant-id }}
        allow-no-subscriptions: true

    - name: Get Trusted Signing access token
      id: azure-token
      if: steps.binaries-list.outputs.has-matches == 'true'
        && inputs.backend == 'azure'
      shell: pwsh
      run: |
        $token = az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv
        echo "::add-mask::$token"
        "token=$token" >> $env:GITHUB_OUTPUT

    - name: Install ebourg/jsign
      if: steps.binaries-list.outputs.has-matches == 'true'
      env:
        # Azure Trusted Signing (TRUSTEDSIGNING storetype) requires jsign >= 7.0.
        JSIGN_VERSION: ${{ inputs.backend == 'azure' && '7.4.0' || inputs.jsign-version }}
      shell: pwsh
      run: |
        choco install jsign --version "${{ env.JSIGN_VERSION }}"

    - name: Prepare for siging
      id: pre-sign
      if: steps.binaries-list.outputs.has-matches == 'true'
      env:
        CODE_SIGN_CHAIN: ${{ inputs.code-sign-chain }}
        BINARIES: ${{ steps.binaries-list.outputs.paths }}
        GH_WORKSPACE: ${{ github.workspace }}
      shell: pwsh
      run: |
        $CODE_SIGN_CHAIN_PEM="codesign-chain.pem"
        $DECODED_CODE_SIGN_CHAIN = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String("${{ env.CODE_SIGN_CHAIN }}"))
        $DECODED_CODE_SIGN_CHAIN | Out-File -FilePath "$CODE_SIGN_CHAIN_PEM"

        $SANITIZED_FILE_PATHS = @()

        foreach ($FILE_PATH in $env:BINARIES -split "`n") {
            $FILE_PATH = $FILE_PATH.Trim()

            if (-not $FILE_PATH) {
              continue
            }

            $FILE_PARENT_PATH = Split-Path -Path $FILE_PATH
            $FILE_RESOLVED_NAME = Split-Path -Path $FILE_PATH -Leaf -Resolve
            $FILE_RESOLVED_NAME_SANITIZED = $FILE_RESOLVED_NAME -replace " ", "-"

            if ($FILE_RESOLVED_NAME_SANITIZED -ne $FILE_RESOLVED_NAME) {
                Rename-Item -Path "${env:GH_WORKSPACE}\$FILE_PARENT_PATH\$FILE_RESOLVED_NAME" -NewName "${env:GH_WORKSPACE}\$FILE_PARENT_PATH\$FILE_RESOLVED_NAME_SANITIZED"
            }

            $SANITIZED_FILE_PATHS += "$FILE_PARENT_PATH/$FILE_RESOLVED_NAME_SANITIZED"
        }

        $SANITIZED_FILE_PATHS_STRING = $SANITIZED_FILE_PATHS -join "%0A" # %0A is interpreted as '\n' by GITHUB_OUTPUT

        echo "code-sign-chain-pem=$CODE_SIGN_CHAIN_PEM" >> $env:GITHUB_OUTPUT
        echo "binaries=$SANITIZED_FILE_PATHS_STRING" >> $env:GITHUB_OUTPUT

    - name: Sign app with jsign (GCP)
      if: steps.binaries-list.outputs.has-matches == 'true'
        && inputs.backend != 'azure'
      env:
        CODE_SIGN_CHAIN: ${{ inputs.code-sign-chain }}
        BINARIES: ${{ steps.pre-sign.outputs.binaries }}
        CERT_FILE: ${{ steps.pre-sign.outputs.code-sign-chain-pem }}
      shell: pwsh
      run: |
        foreach ($BIN_PATH in $env:BINARIES -split "`n") {
          echo "Signing $BIN_PATH..."

          jsign --storetype "${{ inputs.store-type }}" `
            --storepass "${{ inputs.access-token }}" `
            --keystore "${{ inputs.kms-keyring }}" `
            --alias "${{ inputs.kms-keyname }}" `
            --certfile "$env:CERT_FILE" `
            --tsmode "${{ inputs.timestamping-mode }}" `
            --tsaurl "${{ inputs.timestamping-url }}" `
            "$BIN_PATH"
        }

    - name: Sign app with jsign (Azure Trusted Signing)
      if: steps.binaries-list.outputs.has-matches == 'true'
        && inputs.backend == 'azure'
      env:
        BINARIES: ${{ steps.pre-sign.outputs.binaries }}
        AZURE_CODESIGN_TOKEN: ${{ steps.azure-token.outputs.token }}
      shell: pwsh
      run: |
        # The service holds the certificate (no --certfile) and requires the
        # Microsoft RFC3161 timestamp authority.
        foreach ($BIN_PATH in $env:BINARIES -split "`n") {
          echo "Signing $BIN_PATH..."

          jsign --storetype TRUSTEDSIGNING `
            --storepass "$env:AZURE_CODESIGN_TOKEN" `
            --keystore "${{ inputs.azure-codesign-endpoint }}" `
            --alias "${{ inputs.azure-codesign-account }}/${{ inputs.azure-codesign-profile }}" `
            --tsmode RFC3161 `
            --tsaurl "http://timestamp.acs.microsoft.com" `
            "$BIN_PATH"

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
